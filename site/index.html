<style>
/* Layout: сайт начинается с 3D «День на террасе» (прокрутка ведёт солнце), дальше три раздела: процесс, архитекторам, заявка.
   Единый мир бренда (тень и свет) — намеренно один вид, не зависит от темы зрителя. */
:root{
  --shade:#1A1814;      /* тень под перголой — тёплый графит */
  --shade-2:#26231D;
  --stone:#ECE7DF;      /* травертин */
  --stone-2:#E1DAD0;
  --ink:#221F1A;
  --dust:#5E574C;       /* второстепенный текст */
  --brass:#745529;      /* бронза для текста на светлом; на тёмном — #B08A57 (site.css) */
  --brass-lt:#D8BC8E;
  --hair:rgba(34,31,26,.16);
  --hair-dk:rgba(236,231,223,.14);
  --f-disp:'Forum','Noto Serif Armenian',Georgia,serif;
  --f-body:'Jost','Noto Sans Armenian',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--stone);color:var(--ink);font-family:var(--f-body);font-weight:300;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--brass);outline-offset:3px}
.lbl{font-family:var(--f-body);font-weight:500;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase}
:lang(hy) .lbl{letter-spacing:.14em}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.02em}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.005em}
:lang(hy) h1,:lang(hy) h2,:lang(hy) h3{font-weight:300}

/* ── шапка ── */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--shade)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(26,24,20,.92);backdrop-filter:blur(10px);color:var(--stone);border-bottom:1px solid var(--hair-dk)}
.top .wrap{display:flex;align-items:center;gap:28px;height:68px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo svg{width:26px;height:26px}
.logo b{font-family:var(--f-disp);font-weight:400;font-size:1.3rem;letter-spacing:.32em}
nav.main{display:flex;gap:22px;margin-left:auto}
nav.main a{text-decoration:none;font-size:.86rem;color:rgba(236,231,223,.72);transition:color .2s}
nav.main a:hover{color:var(--stone)}
.langs{display:flex;gap:2px;border:1px solid var(--hair-dk);border-radius:99px;padding:2px}
.langs button{font:500 .7rem/1 var(--f-body);letter-spacing:.12em;color:rgba(236,231,223,.6);background:none;border:0;padding:7px 10px;border-radius:99px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--stone);color:var(--shade)}
@media (max-width:980px){nav.main{display:none}.langs{margin-left:auto}}

.cta-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:12px;font:500 .8rem/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:17px 26px;border-radius:0;border:1px solid var(--brass);background:var(--brass);color:var(--shade);cursor:pointer;transition:background .25s,color .25s}
.btn:hover{background:transparent;color:var(--brass-lt)}
.btn.ghost{background:transparent;color:var(--stone);border-color:var(--hair-dk)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass-lt)}
:lang(hy) .btn{letter-spacing:.08em}

/* ── разделы ── */
section{padding-block:104px}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:48px;align-items:end;margin-bottom:56px}
.sec-head h2{font-size:clamp(2rem,3.6vw,3.2rem);line-height:1.08}
.sec-head p{margin:0;color:var(--dust);max-width:52ch}
.sec-head .lbl{color:var(--brass);display:block;margin-bottom:18px}

/* процесс */
.proc{background:var(--shade);color:var(--stone)}
.proc .sec-head p{color:rgba(236,231,223,.6)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:1px solid var(--hair-dk)}
.step{padding:28px 22px 8px 0;display:grid;gap:12px;align-content:start}
.step + .step{padding-left:22px;border-left:1px solid var(--hair-dk)}
.step .mono{color:var(--brass-lt)}
.step h3{font-size:1.35rem}
.step p{margin:0;color:rgba(236,231,223,.62);font-size:.92rem}
.render{margin-top:64px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;align-items:center}
.render img{width:100%;display:block;border:1px solid var(--hair-dk)}
.render p{color:rgba(236,231,223,.68);margin:16px 0 0;max-width:40ch}

/* архитекторам */
.arch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:start}
.arch ul{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--hair)}
.arch li{padding:18px 0;border-bottom:1px solid var(--hair);display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px}
.arch li .mono{color:var(--brass)}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.files span{border:1px solid var(--hair);padding:6px 12px;font-family:var(--f-mono);font-size:.74rem;color:var(--dust)}

/* заявка */
.req{background:var(--stone-2)}
.req .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:64px}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.fld{display:grid;gap:8px}
.fld.wide{grid-column:1/-1}
.fld label{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--dust)}
.fld input,.fld select{font:300 1rem var(--f-body);color:var(--ink);background:transparent;border:0;border-bottom:1px solid rgba(34,31,26,.35);padding:10px 0;border-radius:0;outline:none}
.fld input:focus,.fld select:focus{border-bottom-color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{cursor:pointer;letter-spacing:.06em;text-transform:none;font-size:.86rem;font-weight:400;color:var(--ink);border:1px solid var(--hair);padding:9px 14px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips input:checked + span{color:var(--brass)}
.chips label:has(input:checked){border-color:var(--brass)}
.chips label:has(input:focus-visible){outline:1.5px solid var(--brass);outline-offset:2px}
form .btn{justify-self:start;margin-top:8px}
.done{grid-column:1/-1;color:var(--brass);margin:0}
.contact{display:grid;gap:22px;align-content:start}
.contact .row{display:grid;gap:4px}
.contact .row b{font-family:var(--f-disp);font-weight:400;font-size:1.35rem}
.contact .row span{color:var(--dust)}

footer{background:var(--shade);color:rgba(236,231,223,.64);padding-block:40px;font-size:.84rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between}


/* «День на террасе»: прокрутка ведёт солнце от рассвета до ночи */
.day-track{position:relative;height:340vh;background:var(--shade)}
.day-pin{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);height:calc(100vh - 68px);height:calc(100svh - 68px - env(safe-area-inset-top,0px));overflow:hidden;color:var(--stone)}
.day3d{position:absolute;inset:0}
.day3d canvas{display:block}
.day3d.no3d{background:url(img/villa.jpg) center/cover}
.day-ui{position:absolute;inset:0;display:flex;align-items:flex-end;pointer-events:none;background:linear-gradient(90deg,rgba(26,24,20,.82) 0%,rgba(26,24,20,.35) 45%,rgba(26,24,20,0) 70%)}
.day-ui .wrap{width:100%;padding-block:0 48px;display:grid;gap:10px;max-width:1240px}
.day-ui .lbl{color:var(--brass-lt)}
.day-time{font-family:var(--f-mono);font-weight:400;font-size:clamp(3.2rem,9vw,7rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.day-ui h2{font-size:clamp(2rem,4vw,3.2rem);line-height:1.05}
.day-ui p{margin:0;max-width:38ch;color:rgba(236,231,223,.78);font-weight:400}
.day-prog{width:min(420px,100%);height:1px;background:var(--hair-dk);margin-top:10px}
.day-prog i{display:block;height:100%;width:0;background:var(--brass)}
.day-hint{color:rgba(236,231,223,.64)}
.day-top{position:absolute;inset:0 0 auto;z-index:1;pointer-events:none;padding-top:clamp(28px,6vh,64px);background:linear-gradient(180deg,rgba(26,24,20,.7),rgba(26,24,20,0));padding-bottom:64px}
.day-top .lbl{color:var(--brass-lt)}
.day-top h1{font-size:clamp(2.2rem,4.6vw,4rem);line-height:1.04;margin:14px 0 26px;max-width:18ch;color:var(--stone);overflow-wrap:normal;word-break:normal;hyphens:none}
:lang(hy) .day-top h1{max-width:none}
.day-top h1 em{font-style:normal;color:var(--brass-lt)}
:lang(hy) .day-top h1{font-size:clamp(1.8rem,3.4vw,3rem);line-height:1.12}
.day-top .btn{pointer-events:auto}
@media (max-width:900px){.day-top h1{font-size:clamp(1.7rem,7vw,2.4rem)}:lang(hy) .day-top h1{font-size:clamp(1.5rem,6vw,2.1rem)}}
@media (max-width:900px){.day-ui{background:linear-gradient(0deg,rgba(26,24,20,.88) 0%,rgba(26,24,20,.4) 55%,rgba(26,24,20,0) 80%)}.day-track{height:300vh}}


/* ── узкие экраны ── */
@media (max-width:900px){
  .sec-head,.render,.arch,.req .wrap{grid-template-columns:minmax(0,1fr)}
  section{padding-block:72px}
  .sec-head{gap:16px;margin-bottom:36px}
  .steps{grid-template-columns:minmax(0,1fr)}
  .step,.step + .step{padding:22px 0;border-left:0;border-bottom:1px solid var(--hair-dk)}
  form{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
