<style>
/* Layout: страница одного продукта из коллекции (адрес product.html#<id>).
   Обложка с «Назад» → описание и особенности → модели → цифры → наши работы с этим продуктом
   → где работает → как работаем → заявка → «Назад в коллекцию». */
[hidden]{display:none!important}
.p-hero{position:relative;min-height:min(78vh,760px);display:grid;align-items:end;color:var(--stone);overflow:hidden;background:var(--shade)}
.p-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}
.p-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,24,20,.35),rgba(26,24,20,.88))}
.p-hero .wrap{position:relative;z-index:1;padding-block:40px 56px;display:grid;gap:18px;width:100%;align-self:stretch;grid-template-rows:auto 1fr auto}
.p-hero .top-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:10px;font:500 .78rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--stone);border:1px solid var(--hair-dk);padding:12px 16px;background:rgba(26,24,20,.45)}
.back:hover{border-color:var(--brass);color:var(--brass-lt)}
:lang(hy) .back{letter-spacing:.06em}
.p-hero .txt{display:grid;gap:16px;align-content:end}
.p-hero h1{font-size:clamp(3rem,8vw,6.4rem);line-height:.98}
:lang(hy) .p-hero h1{font-size:clamp(2.2rem,6vw,4.6rem);line-height:1.08}
.p-hero p{margin:0;max-width:52ch;color:rgba(236,231,223,.84);font-weight:400;font-size:1.1rem}
.p-hero .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}

.sec-h h2{font-size:clamp(2rem,3.6vw,3.2rem);line-height:1.06;margin-top:14px}
.sec-h .lbl{color:var(--brass)}
.split{padding-block:88px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:56px}

.feat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--hair)}
.feat-grid div{padding:22px 22px 22px 0;border-bottom:1px solid var(--hair);display:grid;gap:8px}
.feat-grid div:nth-child(2n){padding-left:22px;border-left:1px solid var(--hair)}
.feat-grid b{font-family:var(--f-disp);font-weight:400;font-size:1.5rem}
.feat-grid span{color:var(--dust);font-size:.96rem}
.spec{width:100%;border-collapse:collapse;margin-top:28px}
.spec th,.spec td{text-align:left;padding:14px 0;border-bottom:1px solid var(--hair);vertical-align:top;font-weight:400}
.spec th{color:var(--dust);width:40%;font-size:.9rem}

.reg{border-top:1px solid var(--hair)}
.ser{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 20px}
.ser-card{display:grid;gap:10px;align-content:start}
.ser-card figure{margin:0;aspect-ratio:4/3;overflow:hidden;background:var(--stone-2);position:relative}
.ser-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s cubic-bezier(.2,.6,.2,1)}
.ser-card:hover img{transform:scale(1.04)}
.ser-card .n{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:.7rem;color:var(--stone);background:rgba(26,24,20,.55);padding:4px 8px}
.ser-card h3{font-size:1.5rem;line-height:1.1}
.ser-card .tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.ser-card p{margin:0;color:var(--dust);font-size:.95rem}
.ser-note{color:var(--dust);margin-top:18px}
.ser-card figure.soon{display:grid;place-items:center;background:var(--stone-2);border:1px dashed var(--hair);color:var(--dust)}
.models.wide .split{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.ser{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.ser{grid-template-columns:minmax(0,1fr)}}
.reg div{display:grid;grid-template-columns:3em minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--hair)}
.reg .mono{color:var(--brass)}
.reg b{font-family:var(--f-disp);font-weight:400;font-size:1.6rem}
.reg small{color:var(--dust)}

.facts{background:var(--stone-2)}
.facts .wrap{padding-block:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:32px}
.fact b{display:block;font-family:var(--f-disp);font-weight:400;font-size:clamp(2.6rem,5vw,3.8rem);line-height:1;font-variant-numeric:tabular-nums}
.fact b small{font-family:var(--f-body);font-size:.36em;color:var(--dust);margin-left:6px;letter-spacing:.06em}
.fact span{display:block;margin-top:10px;color:var(--dust);max-width:26ch;font-size:.92rem}

.gal .wrap{padding-block:72px 24px}
.gal h2{margin-bottom:28px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gal-grid a{display:block;aspect-ratio:4/3;overflow:hidden;background:var(--stone-2)}
.gal-grid img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.6,.2,1)}
.gal-grid a:hover img{transform:scale(1.05)}
.gvid{grid-row:span 2;background:var(--shade)}
.gvid video{width:100%;height:100%;object-fit:cover;display:block}

.works{background:var(--stone-2)}
.works .wrap{padding-block:80px 88px}
.works-head{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:end;justify-content:space-between;margin-bottom:36px}
.cases{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:24px 14px}
.case{display:grid;gap:10px;align-content:start}
.case figure{margin:0;aspect-ratio:4/5;overflow:hidden;background:var(--stone)}
.case img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s cubic-bezier(.2,.6,.2,1)}
.case a:hover img{transform:scale(1.05)}
.case h3{font-size:1.15rem;line-height:1.15}
:lang(hy) .case h3{font-size:1rem}
.case .lbl{font-size:.64rem}
.case .lbl{color:var(--brass)}
.case p{margin:0;color:var(--dust);font-size:.92rem}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--hair);padding:12px 16px}
.where p{color:var(--dust);max-width:44ch}

.how{background:var(--shade);color:var(--stone)}
.how .wrap{padding-block:80px}
.how .lbl{color:var(--brass-lt)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:36px;border-top:1px solid var(--hair-dk)}
.step{padding:24px 22px 8px 0;display:grid;gap:10px;align-content:start}
.step + .step{padding-left:22px;border-left:1px solid var(--hair-dk)}
.step .mono{color:var(--brass-lt)}
.step h3{font-size:1.35rem}
.step p{margin:0;color:rgba(236,231,223,.66);font-size:.94rem}

.req .wrap{padding-block:88px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:56px}
.req p.lead{color:var(--dust);max-width:40ch;margin:20px 0 32px}
.contact{display:grid;gap:18px}
.contact .row{display:grid;gap:4px}
.contact .row b{font-family:var(--f-disp);font-weight:400;font-size:1.35rem}
.contact a{text-decoration:none}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;align-content:start}
.fld{display:grid;gap:8px}
.fld.wide{grid-column:1/-1}
.fld label{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--dust)}
.fld input,.fld select,.fld textarea{font:300 1rem var(--f-body);color:var(--ink);background:transparent;border:0;border-bottom:1px solid rgba(34,31,26,.35);padding:10px 0;border-radius:0;outline:none;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-bottom-color:var(--brass)}
form .btn{justify-self:start}
.err{grid-column:1/-1;color:#9A4A2A;margin:0}
.done{grid-column:1/-1;color:var(--brass);margin:0}
.back-row .wrap{padding-block:0 72px;display:flex;justify-content:center}
.back-row .back{color:var(--ink);border-color:var(--hair);background:none}
.back-row .back:hover{color:var(--brass)}

@media (max-width:560px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-width:900px){
  .split,.req .wrap{grid-template-columns:minmax(0,1fr);gap:28px}
  .feat-grid{grid-template-columns:minmax(0,1fr)}
  .feat-grid div:nth-child(2n){padding-left:0;border-left:0}
  .cases{grid-template-columns:repeat(3,minmax(0,1fr))}
  .steps{grid-template-columns:minmax(0,1fr)}
  .step,.step + .step{padding:20px 0;border-left:0;border-bottom:1px solid var(--hair-dk)}
  .reg div{grid-template-columns:2.4em minmax(0,1fr)}
  .reg small{grid-column:2}
  form{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>

function draw(){
  const id = cur(), p = P[id], d = p[lang];
  document.title = 'ARÉVE ' + d.n;
  const img = document.getElementById('hImg'); img.src = FLOW.includes(id) ? 'img/flow/' + id + '.jpg' : 'img/' + p.img + '.jpg'; img.alt = d.n;
  document.getElementById('pName').textContent = d.n;
  document.getElementById('pEn').textContent = p.enName && lang !== 'en' ? p.enName : '';
  document.getElementById('crumbName').textContent = d.n;
  document.getElementById('pLead').textContent = d.l;
  /* особенности и характеристики — только то, что подтверждено */
  const x = d.x || [], s = d.s || [];
  document.getElementById('aboutSec').hidden = !x.length && !s.length;
  document.getElementById('feat').innerHTML = x.map(f => `<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('');
  document.getElementById('spec').innerHTML = s.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('');
  document.getElementById('mH').textContent = d.v ? TT.varH : d.mH;
  const ser = SER[id], reg = document.getElementById('reg');
  document.querySelector('.models').classList.toggle('wide', !!ser);
  if (ser) {
    reg.className = '';
    reg.innerHTML = `<div class="ser">` + d.m.map((m, i) => { const x = ser[i] || {}, src = x.src || 'img/series/' + x.img + '.jpg';
      const fig = x.soon ? `<figure class="soon"><span class="mono">${TT.soon}</span><span class="n">${String(i + 1).padStart(2, '0')}</span></figure>` : `<figure><img src="${src}" alt="${m[0]}" loading="lazy"><span class="n">${String(i + 1).padStart(2, '0')}</span></figure>`;
      return `<div class="ser-card">${fig}
        <span class="tag">${x.t ? x.t[lang] : m[1]}</span><h3>${m[0]}</h3>${x.d ? `<p>${x.d[lang]}</p>` : ''}</div>`; }).join('') + `</div>` + (ser.some(x => x.img) ? `<p class="ser-note mono">${TT.illus}</p>` : '');
  } else {
    reg.className = 'reg';
    reg.innerHTML = d.m.map((m, i) => `<div><span class="mono">${String(i + 1).padStart(2, '0')}</span><b>${m[0]}</b><small>${m[1]}</small></div>`).join('');
  }
  document.getElementById('factsWrap').hidden = !d.f.length;
  document.getElementById('facts').innerHTML = d.f.map(f => `<div class="fact"><b>${f[0]}${f[1] ? `<small>${f[1]}</small>` : ''}</b><span>${f[2]}</span></div>`).join('');
  /* наши работы с этим продуктом (work.js → CASES[].sys) */
  const mine = CASES.filter(c => c.sys.includes(id));
  document.getElementById('works').hidden = !mine.length;
  document.getElementById('toWorks').hidden = !mine.length;
  document.getElementById('wkH').textContent = TT.wkH + ' / ' + d.n;
  document.getElementById('wkAll').href = 'projects.html?sys=' + id;
  const ttl = c => c.name || c[lang][0];
  document.getElementById('cases').innerHTML = mine.slice(0, 6).map(c => {
    const rest = c.ph.slice(1).map(n => `<a href="${WORK}w${pad(n)}.jpg" data-lb="${ttl(c)}" data-lb-group="c-${c.id}" hidden></a>`).join('');
    return `<div class="case"><a href="${WORK}w${pad(c.cover)}.jpg" data-lb="${ttl(c)}" data-lb-group="c-${c.id}"><figure><img src="${WORK}g/w${pad(c.cover)}.jpg" alt="${ttl(c)}" loading="lazy"></figure></a>${rest}
      <span class="lbl">${SPN[c.sp] ? SPN[c.sp][lang] : ''}</span><h3>${ttl(c)}</h3></div>`;
  }).join('');
  document.getElementById('where').innerHTML = (p.sp || []).map(s => `<span>${SPN[s][lang]}</span>`).join('');
  document.getElementById('steps').innerHTML = STEPS[lang].map((s, i) => `<div class="step"><span class="mono">0${i + 1}</span><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');
  /* заявка: продукт выбран заранее */
  document.getElementById('rH').textContent = TT.rH + ' ' + d.n.toLowerCase();
  document.getElementById('r-prod').innerHTML = ORDER.map(k => `<option value="${k}"${k === id ? ' selected' : ''}>${P[k][lang].n}</option>`).join('');
  document.getElementById('r-when').innerHTML = WHEN[lang].map(w => `<option>${w}</option>`).join('');
}
