<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<base href="/areve/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARÉVE Collection</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ARÉVE collection: pergolas, awnings, glazing, decking, umbrellas, misting, blinds and outdoor screens.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Jost:wght@300;400;500&family=Noto+Serif+Armenian:wght@300;400&family=Noto+Sans+Armenian:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="site.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Layout: каталог из 14 плиток одного формата 16:9 (под картинки и будущие ролики). Картинки — одна серия из Google Flow (img/flow/<id>.jpg),
   пока их нет — временно фото объекта. Ниже — готовые работы и переход на страницу работ с фильтром. */
.tiles-sec .wrap{padding-block:56px 88px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 20px}
.tile{display:grid;gap:12px;text-decoration:none;color:inherit}
.tile figure{margin:0;position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--stone-2)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s cubic-bezier(.2,.6,.2,1)}
.tile:hover img{transform:scale(1.045)}
.tile .n{position:absolute;left:12px;top:12px;font-family:var(--f-mono);font-size:.72rem;color:var(--stone);background:rgba(26,24,20,.55);padding:4px 8px}
.tile h2{font-size:1.45rem;line-height:1.15}
:lang(hy) .tile h2{font-size:1.25rem}
.tile .en{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.tile:hover h2{color:var(--brass)}

.done-sec{background:var(--stone-2)}
.done-sec .wrap{padding-block:80px 96px}
.done-head{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:end;justify-content:space-between;margin-bottom:40px}
.done-head h2{font-size:clamp(2rem,3.6vw,3.2rem);line-height:1.06;margin-top:14px}
.done-head .lbl{color:var(--brass)}
.cases{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:24px 14px}
.case{display:grid;gap:10px;align-content:start}
.case figure{margin:0;position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--stone)}
.case img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s cubic-bezier(.2,.6,.2,1)}
.case a:hover img{transform:scale(1.05)}
.case h3{font-size:1.15rem;line-height:1.15}
:lang(hy) .case h3{font-size:1rem}
.case .lbl{font-size:.64rem}
.case .lbl{color:var(--brass)}
.case p{margin:0;color:var(--dust);font-size:.92rem}

@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.cases{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.tiles{grid-template-columns:minmax(0,1fr);gap:28px}.cases{grid-template-columns:repeat(2,minmax(0,1fr))}.tile h2{font-size:1.2rem}:lang(hy) .tile h2{font-size:1.05rem}}
</style>
</head>
<body>
<main>
<div class="intro dark">
  <div class="wrap">
    <span class="crumb mono"><a href="index.html">ARÉVE</a> / <span data-t="navColl"></span></span>
    <h1 data-t="h1"></h1>
    <p data-t="introP"></p>
  </div>
</div>

<section class="tiles-sec">
  <div class="wrap"><div class="tiles" id="tiles"></div></div>
</section>

<section class="done-sec">
  <div class="wrap">
    <div class="done-head">
      <div><span class="lbl" data-t="dKick"></span><h2 data-t="dH"></h2></div>
      <a class="btn" href="projects.html" data-t="dAll"></a>
    </div>
    <div class="cases" id="cases"></div>
  </div>
</section>
</main>

<script src="work.js"></script>
<script src="vendor/lenis.min.js"></script>
<script src="vendor/motion.js"></script>
<script src="site.js"></script>
<script>
/* ⚠️ Армянский текст написан Claude — вычитать носителю. Названия штор — из задания заказчика (work.js).
   Картинки плиток: img/flow/<id>.jpg (серия из Google Flow, промпты — areve/flow-prompts.md).
   Пока id нет в FLOW, плитка показывает фото объекта ARÉVE (fb). */
const T = {
 hy:{h1:'Տեսականի',introP:'Տասնչորս համակարգ՝ ստվերի, ապակու, տեռասի և ինտերիերի համար։ Ընտրեք համակարգը, և կտեսնեք մանրամասները։',
  dKick:'Իրականացված լուծումներ',dH:'Ինչպես է սա աշխատում Երևանում',dAll:'Բոլոր աշխատանքները →',ph:'լուս.'},
 ru:{h1:'Коллекция',introP:'Четырнадцать систем для тени, стекла, террасы и интерьера. Выберите систему, чтобы увидеть подробности.',
  dKick:'Готовые решения',dH:'Как это работает в Ереване',dAll:'Все работы →',ph:'фото'},
 en:{h1:'Collection',introP:'Fourteen systems for shade, glass, terraces and interiors. Pick one to see the details.',
  dKick:'Completed work',dH:'How it works in Yerevan',dAll:'All our work →',ph:'photos'}
};
const pad = n => String(n).padStart(3, '0');
/* 6 семейств + 8 штор и экранов; go — куда ведёт плитка, fb — временная картинка */
const FAM6 = [
 {id:'pergola',  name:'Pergola',      go:'product.html#pergola', fb:'img/villa.jpg',         hy:'Պերգոլա',              ru:'Перголы',              en:'Pergolas'},
 {id:'awning',   name:'Awnings',      go:'product.html#awning',       fb:'img/awning-detail.jpg', hy:'Մարկիզաներ',           ru:'Маркизы',              en:'Awnings'},
 {id:'glazing',  name:'Glazing',      go:'product.html#glazing',      fb:'img/glazing.jpg',       hy:'Ապակեպատում',          ru:'Остекление',           en:'Glazing'},
 {id:'deck',     name:'Decking',      go:'product.html#deck',         fb:'img/deck.jpg',          hy:'Դեկինգ',               ru:'Террасная доска',      en:'Decking'},
 {id:'umbrella', name:'Umbrellas',    go:'product.html#umbrella',     fb:'img/umbrella.jpg',      hy:'Անձրևանոցներ',         ru:'Зонты',                en:'Umbrellas'},
 {id:'mist',     name:'Mist cooling', go:'product.html#mist',         fb:'img/sail.jpg',          hy:'Մառախլային զովացում',  ru:'Туманное охлаждение',  en:'Misting'}
];
const CATS = FAM6.concat(SHADES.map(s => ({ id: s.id, name: s.name, go: 'product.html#' + s.id, fb: WORK + 't/w' + pad(s.ph[0]) + '.jpg', hy: s.hy[0], ru: s.ru[0], en: s.en[0] })));
const SPN = {home:{hy:'Առանձնատուն',ru:'Частный дом',en:'Private home'},rest:{hy:'Ռեստորան',ru:'Ресторан',en:'Restaurant'},roof:{hy:'Տեռաս և տանիք',ru:'Терраса и крыша',en:'Terrace & roof'},wg:{hy:'Ձմեռային այգի',ru:'Зимний сад',en:'Winter garden'}};
const SHOW = 6;


areveInit('collection.html', T, (L, t) => {
  document.getElementById('tiles').innerHTML = CATS.map((c, i) => `
    <a class="tile" href="${c.go}">
      <figure><img src="${FLOW.includes(c.id) ? 'img/flow/' + c.id + '.jpg' : c.fb}" alt="${c[L]}" loading="${i < 8 ? 'eager' : 'lazy'}"><span class="n">${String(i + 1).padStart(2, '0')}</span></figure>
      <h2>${c[L]}</h2><span class="en">${c.name}</span>
    </a>`).join('');
  const ttl = c => c.name || c[L][0];
  document.getElementById('cases').innerHTML = CASES.slice(0, SHOW).map(c => {
    const rest = c.ph.slice(1).map(n => `<a href="${WORK}w${pad(n)}.jpg" data-lb="${ttl(c)}" data-lb-group="c-${c.id}" hidden></a>`).join('');
    return `<div class="case">
      <a href="${WORK}w${pad(c.cover)}.jpg" data-lb="${ttl(c)}" data-lb-group="c-${c.id}"><figure><img src="${WORK}g/w${pad(c.cover)}.jpg" alt="${ttl(c)}" loading="lazy"></figure></a>${rest}
      <span class="lbl">${SPN[c.sp] ? SPN[c.sp][L] : ''} · ${c.ph.length} ${t.ph}</span>
      <h3>${ttl(c)}</h3>
    </div>`;
  }).join('');
});
</script>
</body>
</html>
